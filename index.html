<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vuggevagt has moved to Lull</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1017">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg: #0d1017; --card: #161b26; --fg: #f2f5fb; --dim: #b3bdd0; --accent: #a79bff; --ink: #0d1017; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f4fb; --card: #fff; --fg: #171a23; --dim: #4c5465; --accent: #5b45d8; --ink: #fff; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
         min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; text-align: center; }
  main { max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 22px; }
  .logo { font-size: 44px; }
  h1 { font-size: 22px; margin: 10px 0 8px; }
  p { color: var(--dim); line-height: 1.5; font-size: 15px; margin-bottom: 18px; }
  a.btn { display: block; background: var(--accent); color: var(--ink); text-decoration: none; font-weight: 700;
          padding: 14px; border-radius: 14px; }
  small { display: block; color: var(--dim); margin-top: 14px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="logo">🌙</div>
  <h1>Vuggevagt has moved to Lull</h1>
  <p>The baby monitor is now part of Lull, under the <b>Night</b> tab. Install Lull on both phones. Your pairing carries over, so you may not need a new code.</p>
  <a class="btn" id="go" href="https://bordingcode.github.io/lull/#night">Open Lull</a>
  <small>Taking you there in a moment…</small>
</main>
<script>
  // Keep anything after # (Vuggevagt's pairing links carry #p=CODE).
  var target = 'https://bordingcode.github.io/lull/#night';
  if (true && location.hash.length > 1) target = target.split('#')[0] + location.hash;
  document.getElementById('go').href = target;
  // Phones that installed the old app hold it in a service-worker cache: take it out.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations()
    .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('vuggevagt') === 0) caches.delete(k); }); }).catch(function () {});
  setTimeout(function () { location.replace(target); }, 2500);
</script>
</body>
</html>
